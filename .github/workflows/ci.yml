name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + e2e (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 제약 린트가 최근 커밋 메시지도 본다 / the constraint lint also reads recent commit messages
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (node:test)
        run: npm test
      - name: Constraint lint
        run: npm run lint:constraints
      - name: Lesson packs (packs:check)
        run: npm run packs:check
      - name: Install Playwright (test-only dependency)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Two-screen scenario (Playwright)
        env:
          E2E_TIMEOUT: 15000
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-node${{ matrix.node }}
          retention-days: 7
          path: dist/shots
          if-no-files-found: ignore
