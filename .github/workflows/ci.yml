name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit + two-screen e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (node:test)
        run: npm test
      - name: Install Playwright (test-only dependency)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Two-screen scenario (Playwright)
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/shots
          if-no-files-found: ignore
